
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Draws Expert</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #07120e;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    text-align: center;
}

main {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 35px 16px 50px;
}

/* Download section */
.download-text {
    color: #36d68b;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

.download-btn {
    display: inline-block;
    transition: 0.25s;
}

.download-btn:hover {
    transform: translateY(-3px);
}

.playstore-logo {
    display: block;
    width: 245px;
    max-width: 100%;
    height: auto;
}

/* Screenshot frame */
.preview-frame {
    margin: 42px auto 0;
    width: 100%;
    max-width: 590px;
    padding: 9px;
    background: #0d1c15;
    border: 1px solid #168653;
    border-radius: 22px;
    box-shadow: 0 15px 55px rgba(23, 190, 112, 0.13);
}

.preview-frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
}

/* Mobile */
@media(max-width: 600px) {
    main {
        padding: 30px 12px 40px;
    }

    .preview-frame {
        margin-top: 35px;
        padding: 6px;
        border-radius: 17px;
    }
}
</style>
</head>

<body>

<main>

    <p class="download-text">👇 DOWNLOAD NOW</p>

    <a class="download-btn"
       href="https://play.google.com/store/apps/details?id=daily.drawsexpert"
       target="_blank"
       rel="noopener noreferrer">

        <img
          src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
          alt="Get it on Google Play"
          class="playstore-logo">

    </a>

    <div class="preview-frame">
        <img
          src="https://raw.githubusercontent.com/futboldev/2-ODSLANDINGPAGE/main/6667.jpg"
          alt="Daily Draws Expert App Screenshot">
    </div>

</main>

</body>
</html>
